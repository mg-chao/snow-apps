[package]
name = "snow-shot-updater"
version = "1.0.7"
edition = "2024"
license = "GPL-3.0-only"
publish = false
build = "build.rs"

[lib]
name = "snow_shot_updater"
path = "src/lib.rs"

[[bin]]
name = "snow-shot-updater"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
bytes = "1.11.0"
fs2 = "0.4.3"
futures-util = "0.3.31"
path-clean = "1.0.1"
regex = { version = "1.12.2", default-features = false, features = ["perf", "std", "unicode-case"] }
reqwest = { version = "0.12.28", default-features = false, features = ["native-tls", "stream"] }
rsa = { version = "0.9.9", features = ["sha2"] }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "parsing"] }
tokio = { version = "1.49.0", default-features = false, features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7.17", features = ["rt"] }
tracing = { version = "0.1.41", default-features = false, features = ["attributes", "std"] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt"] }
uuid = { version = "1.18.1", features = ["v4"] }
walkdir = "2.5.0"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemServices",
  "Win32_System_TaskScheduler",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1.12"

[dev-dependencies]
proptest = "1.9.0"
rand = "0.8.5"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = [
  "Win32_System_ApplicationInstallationAndServicing",
  "Win32_System_WindowsProgramming",
] }

[profile.release-size]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 2
strip = "none"
incremental = false
overflow-checks = true

[profile.release-fast]
inherits = "release"
opt-level = 2
codegen-units = 16
lto = "thin"
debug = 2
incremental = true
