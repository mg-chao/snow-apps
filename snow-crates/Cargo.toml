[workspace]
members = [
    "crates/snow-core",
    "crates/snow-cursor",
    "crates/snow-pipeline",
    "crates/snow-capture",
    "crates/snow-capture-c",
    "crates/snow-ui-selector",
    "crates/snow-ui-selector-c",
    "crates/snow-stitch-images",
    "crates/snow-stitch-images-c",
    "crates/snow-ocr-c",
    "crates/snow-audio-recorder",
    "crates/rapid-ocr-rs",
    "crates/snow-recording-model",
    "crates/snow-recording-runtime",
    "crates/snow-recording-export",
    "crates/snow-screen-recorder",
]
resolver = "3"

[workspace.package]
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.102"
bincode = "1.3.3"
crossbeam-channel = "0.5"
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }
half = "2.7.1"
image = { version = "0.25.9", default-features = false, features = ["png"] }
png = "0.18.1"
rand = "0.9.5"
rayon = "1.11.0"
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
smallvec = "1"
tempfile = "3"
thiserror = "2.0.17"
tokio = { version = "1.49.0", default-features = false }
uuid = { version = "1.18.1", features = ["v4"] }
windows = "0.62.2"
windows-core = "0.62.2"
num_cpus = "1.17.0"
rstar = "0.12.2"
zstd = "0.13.3"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
debug = 0
incremental = false
overflow-checks = false

[profile.dev.package.snow-stitch-images]
opt-level = 3

[profile.dev.package.snow-capture]
opt-level = 3

[profile.dev.package.snow-cursor]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.rayon]
opt-level = 3

[profile.dev-fast]
inherits = "dev"
opt-level = 3
debug = true

[profile.release-fast]
inherits = "release"
opt-level = 2
codegen-units = 16
lto = "thin"
incremental = true

[profile.bench]
debug = true
