[package]
name = "snow-recording-c"
version = "0.1.0"
edition = "2024"
license.workspace = true
[lib]
crate-type = ["staticlib", "rlib"]
[dependencies]
snow-webcam = { path = "../snow-webcam" }
snow-memory = { path = "../snow-memory" }
snow-media = { path = "../snow-media" }
snow-capture = { path = "../snow-capture" }
snow-screen-recorder = { path = "../snow-screen-recorder", default-features = false }
snow-audio-recorder = { path = "../snow-audio-recorder" }
anyhow.workspace = true
snow-recording-export = { path = "../snow-recording-export", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
snow-macos = { path = "../snow-macos" }

[features]
default = ["legacy-capture", "hdr-encoding"]
hdr-encoding = ["snow-screen-recorder/hdr-encoding", "snow-recording-export/hdr-encoding"]
legacy-capture = ["snow-screen-recorder/legacy-capture"]
