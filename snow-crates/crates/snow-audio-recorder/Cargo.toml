[package]
name = "snow-audio-recorder"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
bench-internals = []

[dependencies]
snow-core = { path = "../snow-core" }
snow-recording-model = { path = "../snow-recording-model" }
anyhow.workspace = true
windows-core.workspace = true
windows = { workspace = true, features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
criterion = "0.5"
proptest = "1.11.0"

[[bench]]
name = "audio_hot_path"
harness = false
required-features = ["bench-internals"]
