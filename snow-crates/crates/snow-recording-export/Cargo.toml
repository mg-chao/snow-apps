[package]
name = "snow-recording-export"
version = "0.1.0"
edition = "2024"
license.workspace = true
build = "build.rs"

[features]
default = ["hdr-encoding"]
# Standalone recording APIs retain HDR output. Snow Shot's Windows recording
# profile captures SDR and excludes this encoder-only capability.
hdr-encoding = []
bench-timing = []
bench-experiments = []

[dependencies]
snow-memory = { path = "../snow-memory" }
snow-core = { path = "../snow-core" }
snow-audio-recorder = { path = "../snow-audio-recorder" }
snow-recording-model = { path = "../snow-recording-model" }
snow-recording-effects = { path = "../snow-recording-effects" }
snow-webcam = { path = "../snow-webcam" }
bincode.workspace = true
crossbeam-channel.workspace = true
ffmpeg-next.workspace = true
gif = { version = "0.14.2", default-features = false, features = ["std", "raii_no_panic"] }
rayon.workspace = true
num_cpus.workspace = true
serde.workspace = true
tempfile.workspace = true
thiserror.workspace = true
zstd.workspace = true
uuid.workspace = true
snow-media = { path = "../snow-media" }

[target.'cfg(windows)'.dependencies]
snow-d3d11 = { path = "../snow-d3d11" }
windows = { workspace = true, features = ["Win32_Graphics_Direct3D11", "Win32_Media_Audio", "Win32_System_Com"] }

[dev-dependencies]
anyhow.workspace = true
proptest = "1.11.0"
symphonia = { version = "0.5.4", default-features = false, features = ["aac", "isomp4"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = [
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
snow-macos = { path = "../snow-macos" }
