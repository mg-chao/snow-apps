[package]
name = "snow-screen-recorder"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
snow-recording-model = { path = "../snow-recording-model" }
snow-recording-runtime = { path = "../snow-recording-runtime" }
snow-recording-export = { path = "../snow-recording-export" }

[dev-dependencies]
crossbeam-channel.workspace = true
ffmpeg-next.workspace = true
proptest = "1.11.0"
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
