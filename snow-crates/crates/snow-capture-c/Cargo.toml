[package]
name = "snow-capture-c"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
snow-capture = { path = "../snow-capture" }
snow-core = { path = "../snow-core" }
anyhow.workspace = true


[[example]]
name = "desktop_session_benchmark"

[[example]]
name = "scroll_region_benchmark"

[target.'cfg(target_os = "macos")'.dependencies]
snow-macos = { path = "../snow-macos" }
snow-media = { path = "../snow-media" }

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }
