[package]
name = "snow-recording-effects"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
crossbeam-channel.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Imaging", "Win32_System_Com",
] }

[features]
bench-timing = []
# Bench-only synthetic input: retains a channel sender next to the keyboard
# hook so benchmarks can feed KeyObservation values without injecting OS
# input. Production builds never enable this.
bench-synthetic-input = []
