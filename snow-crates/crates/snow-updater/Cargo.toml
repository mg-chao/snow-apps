[package]
name = "snow-updater"
version = "1.0.4"
edition = "2024"
license.workspace = true
description = "Snow Shot standalone update helper and release-contract verifier"
publish = false

[lib]
name = "snow_updater"
path = "src/lib.rs"

[[bin]]
name = "snow-shot-updater"
path = "src/main.rs"

[dependencies]
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
zip = { workspace = true }

[features]
# Enables the in-process RSA test signer for fixture-based tests.
signing = []

[dev-dependencies]
snow-updater = { path = ".", features = ["signing"] }
tempfile = { workspace = true }

[build-dependencies]
winres = "0.1"
