[package]
name = "snow-ocr-process"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "snow-ocr-process"
path = "src/main.rs"

[features]
default = ["dynamic-onnx-runtime", "directml-provider"]
# Load the vcpkg-provided onnxruntime.dll at runtime; used by the dynamic
# Debug/performance workspaces whose vcpkg tree only installs the DLL.
dynamic-onnx-runtime = ["rapid-ocr-rs/dynamic-onnx-runtime"]
# Link ONNX Runtime statically into this executable. The final link
# directives come from the CMake-generated manifest referenced by
# SNOW_ONNXRUNTIME_LINK_FILE (see build.rs).
static-onnx-runtime = ["rapid-ocr-rs/static-onnx-runtime"]
directml-provider = ["rapid-ocr-rs/directml-provider"]

[dependencies]
memmap2 = "0.9"
num_cpus = "1.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rapid-ocr-rs = { path = "../rapid-ocr-rs", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
