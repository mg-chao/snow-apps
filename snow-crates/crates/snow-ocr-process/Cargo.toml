[package]
name = "snow-ocr-process"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "snow-ocr-process"
path = "src/main.rs"

[dependencies]
memmap2 = "0.9"
num_cpus = "1.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rapid-ocr-rs = { path = "../rapid-ocr-rs", default-features = false, features = ["dynamic-onnx-runtime", "directml-provider"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
