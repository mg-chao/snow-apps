name: Snow Shot Scoop

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable published Snow Shot tag (v1.1.8 or v1.1.8_snow-shot)
        required: true
        type: string
  pull_request:
    paths:
      - scripts/*scoop*.ps1
      - .github/workflows/snow-shot-scoop.yml
  push:
    branches: [main]
    paths:
      - scripts/*scoop*.ps1
      - .github/workflows/snow-shot-scoop.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check out pinned Scoop schema and runtime
        uses: actions/checkout@v5
        with:
          repository: ScoopInstaller/Scoop
          ref: b588a06e41d920d2123ec70aee682bae14935939
          path: build/scoop-runtime
          persist-credentials: false
      - name: Verify manifest generation and schema
        shell: pwsh
        run: ./scripts/test-snow-shot-scoop.ps1 -SchemaPath build/scoop-runtime/schema.json
      - name: Verify isolated Scoop lifecycle
        shell: pwsh
        run: ./scripts/test-snow-shot-scoop-install.ps1 -ScoopRoot build/scoop-runtime
      - name: Generate verified manifest for upstream submission
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/new-snow-shot-scoop-manifest.ps1 -Tag $env:RELEASE_TAG
          if (-not (Test-Json -Json (Get-Content build/scoop/snowshot.json -Raw) -SchemaFile build/scoop-runtime/schema.json)) {
            throw 'Scoop schema validation failed.'
          }
      - name: Preserve manifest for upstream submission
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: snow-shot-scoop-manifest
          path: build/scoop/snowshot.json
          if-no-files-found: warn
