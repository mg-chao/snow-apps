name: Publish Snow Shot Homebrew cask

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable or beta Snow Shot tag (v<version> with optional _snow-shot)
        required: true
        type: string
      repair_architectures:
        description: Restore a missing architecture without changing existing archive checksums or cask settings
        type: boolean
        default: false

permissions:
  contents: write

# Serialize all versions so an older run cannot overwrite a newer cask.
concurrency:
  group: snow-shot-homebrew
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !github.event.release.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Validate tag and tap configuration
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          python3 - <<'PY'
          import importlib.util, os
          spec = importlib.util.spec_from_file_location('homebrew', 'scripts/snow-shot-homebrew.py')
          helper = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(helper)
          tag = os.environ['RELEASE_TAG']
          helper.tag_version(tag)
          if not os.environ['TAP_TOKEN']:
              raise SystemExit('Configure HOMEBREW_TAP_TOKEN with contents write access to mg-chao/homebrew-tap.')
          PY
      - name: Check out matching release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          path: release-source
          persist-credentials: false
      - name: Check out tap
        uses: actions/checkout@v4
        with:
          repository: mg-chao/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Verify focused release contracts
        run: python3 scripts/test-snow-shot-homebrew.py
      - name: Publish archive and cask
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          REPAIR_ARCHITECTURES: ${{ inputs.repair_architectures || false }}
        run: |
          args=(publish --tag "$RELEASE_TAG" --source release-source
                --tap homebrew-tap --output artifacts/homebrew)
          if [ "$REPAIR_ARCHITECTURES" = true ]; then
            args+=(--repair-architectures)
          fi
          python3 scripts/snow-shot-homebrew.py "${args[@]}"
